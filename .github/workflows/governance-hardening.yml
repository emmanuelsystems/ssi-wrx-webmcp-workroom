name: Governance hardening

on:
  push:
    branches:
      - codex/governance-mvp

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'Run verified governance hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/governance-mvp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize patch literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/governance-hardening.py')
          s = p.read_text()
          s = s.replace('replace_once("src/App.jsx", \'\'\'', 'replace_once("src/App.jsx", r\'\'\'')
          s = s.replace("''', '''", "''', r'''")
          p.write_text(s)
          PY
      - name: Apply governance invariants
        run: python3 scripts/governance-hardening.py
      - run: npm ci
      - run: npm run test:intake
      - run: npm run build
      - run: npm run lint
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/governance.js server/autopilotAgent.mjs server/orchestrationAgent.mjs test/governance.test.js test/orchestration.test.js README.md
          git commit -m "Harden governance invariants"
          git push origin HEAD:codex/governance-mvp

name: Governance hardening

on:
  push:
    branches:
      - codex/governance-mvp

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/governance-mvp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply governance invariants
        id: patch
        continue-on-error: true
        run: python3 scripts/governance-hardening.py 2> hardening-error.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-hardening-diagnostic
          path: hardening-error.txt
      - name: Stop if patch failed
        if: steps.patch.outcome == 'failure'
        run: exit 1
      - run: npm ci
      - run: npm run test:intake
      - run: npm run build
      - run: npm run lint
